<section id="about" class="section about">
  <div class="container">
    <div class="section-head" appReveal>
      <p class="eyebrow">About Me</p>
      <h2 class="section-title">Turning complex requirements into <span class="gradient-text">clean, scalable software</span></h2>
    </div>

    <div class="about-grid">
      <div class="about-text" appReveal>
        <p>{{ profile.summary }}</p>

        <div class="highlight-grid">
          @for (item of highlights; track item.title; let i = $index) {
            <div class="highlight-card" appReveal [revealDelay]="i * 90">
              <div class="highlight-icon"><i [class]="item.icon"></i></div>
              <div>
                <h4>{{ item.title }}</h4>
                <p>{{ item.text }}</p>
              </div>
            </div>
          }
        </div>
      </div>

      <div class="about-stats" appReveal [revealDelay]="120">
        @for (stat of stats; track stat.label) {
          <div class="stat-card">
            <div class="stat-value">
              <span [appCountUp]="stat.value" [suffix]="stat.suffix"></span>
            </div>
            <p class="stat-label">{{ stat.label }}</p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
